name: build-locus-vpn-spoofer-unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Fetch upstream idevice library
        run: chmod +x scripts/fetch-idevice.sh && ./scripts/fetch-idevice.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LocusVPNSpoofer.xcodeproj \
            -scheme LocusVPNSpoofer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_CERTIFICATE_NAME="" \
            SWIFT_VERSION=5.0 \
            clean build 2>&1 | tee build.log
            BUILD_STATUS=${PIPESTATUS[0]}
            echo "BUILD_STATUS=$BUILD_STATUS"
            exit $BUILD_STATUS

      - name: Print build errors
        if: failure()
        run: |
          echo "===== BUILD LOG SIZE ====="
          wc -l build.log || true
          echo "===== ERRORS ====="
          grep -nE "error:|fatal error|error |undefined symbol|ld: |Ld " build.log || true
          echo "===== TAIL ====="
          tail -n 160 build.log || true
          echo "===== UPLOAD LOG ====="

      - name: Debug build tree
        if: failure()
        run: |
          find build/Build/Products -maxdepth 6 -type d -print || true
          find build/Build/Products -maxdepth 6 -type f -name "*.app" -print || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log

      - name: Publish build errors to annotations
        if: failure()
        run: |
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -nE "error:|fatal error|error |undefined symbol|ld: |Ld " build.log || true)
          echo "::group::Xcode build tail"
          cat build.log || true
          echo "::endgroup::"
          echo "::group::Linker diagnostics"
          grep -nE "Undefined symbols|referenced from|symbol not found|not found for architecture|clang: error|ld: " build.log || true
          echo "::endgroup::"

      - name: Locate built app
        id: locate
        run: |
          APP_PATH="$(find build/Build/Products -type d -name 'LocusVPNSpoofer.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::LocusVPNSpoofer.app was not found"
            find build/Build/Products -maxdepth 5 -type d -print || true
            exit 1
          fi
          if [ ! -f "$APP_PATH/LocusVPNSpoofer" ]; then
            echo "::error::App binary missing at $APP_PATH/LocusVPNSpoofer"
            find "$APP_PATH" -maxdepth 2 -type f -print || true
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP_PATH"
          ls -lh "$APP_PATH/LocusVPNSpoofer"

      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          rm -rf Payload LocusVPNSpoofer-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LocusVPNSpoofer-unsigned.ipa Payload
          test -s LocusVPNSpoofer-unsigned.ipa
          IPA_SIZE="$(stat -f%z LocusVPNSpoofer-unsigned.ipa)"
          if [ "$IPA_SIZE" -lt 100000 ]; then
            echo "::error::IPA too small: $IPA_SIZE bytes"
            exit 1
          fi
          echo "IPA size: $IPA_SIZE bytes"
          shasum -a 256 LocusVPNSpoofer-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusVPNSpoofer-unsigned-IPA
          path: LocusVPNSpoofer-unsigned.ipa
