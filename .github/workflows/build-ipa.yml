name: build-locus-vpn-spoofer

on:
  workflow_dispatch:
    inputs:
      development_team:
        description: Apple Developer Team ID
        required: true
      export_method:
        description: development or ad-hoc
        required: true
        default: development

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$SIGNING_CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Import provisioning profiles
        env:
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          TUNNEL_PROFILE: ${{ secrets.TUNNEL_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APP_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo "$TUNNEL_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision

      - name: Build IPA
        env:
          DEVELOPMENT_TEAM: ${{ inputs.development_team }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: chmod +x scripts/build_ipa.sh && ./scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocusVPNSpoofer-IPA
          path: build/ipa/*.ipa
